name: Homer5 Docker

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.external-mysql.yml config >/dev/null
      - name: Validate rotation.ini coverage
        run: |
          grep -q 'report_capture = 0' cron/rotation.ini

  build-images:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        image:
          - webapp
          - cron
          - kamailio
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.image }}
        continue-on-error: true
        run: docker build -t "sipcapture/homer-${{ matrix.image }}:ci" "./${{ matrix.image }}"
