version: '2'
services:
  # --------------------------------------------- Web app container
  webapp:
    container_name: homer-webapp
    build: ./webapp/.
    image: sipcapture/homer-webapp
    ports:
      - "80:80"
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    volumes:
      - /homer-api/
      - homer-data-semaphore:/homer-semaphore/
      - homer-data-dashboard:/var/www/html/store/dashboard/
    links:
      - "mysql:mysql"
    env_file:
      - ./homer.env
    restart: always
  # --------------------------------------------- cron container
  cron:
    container_name: homer-cron
    build: ./cron/.
    image: sipcapture/homer-cron
    depends_on:
      - mysql
    volumes:
      - homer-data-semaphore:/homer-semaphore/
    links:
      - "mysql:mysql"
    env_file:
      - ./homer.env
    restart: always
  # --------------------------------------------- Kamailio container
  kamailio:
    container_name: homer-kamailio
    build: ./kamailio/.
    image: sipcapture/homer-kamailio
    ports:
      - "9060:9060/udp"
    depends_on:
      - mysql
    links:
      - "mysql:mysql"
    volumes:
      - homer-data-semaphore:/homer-semaphore/
    # entrypoint:
    #   - /bin/bash
    # command:
    #   >
    #   -c 'while true; do sleep 60; done;'
    env_file:
      - ./homer.env
    restart: always
  # --------------------------------------------- Data bootstrapping container
  # debug with:
  # docker run -it --volumes-from homer-webapp --network homerdocker_default --link mysql:mysql mysql:5.6 /bin/bash
  bootstrap:
    container_name: bootstrap-mysql
    image: mysql:5.6
    depends_on:
      - mysql
      - webapp
    links:
      - "mysql:mysql"
    volumes_from:
      - webapp
    volumes:
      - homer-data-semaphore:/homer-semaphore/
      - ./bootstrap-data/bootstrap.sh:/bootstrap.sh
    # entrypoint:
    #   - /bin/bash
    # command:
    #   >
    #   -c 'while true; do sleep 60; done;'
    entrypoint:
      - /bootstrap.sh
    env_file:
      - ./homer.env
  # --------------------------------------------- MySQL container.
  mysql:
    container_name: mysql
    image: mysql:5.6
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      - ./mysql/run.sh:/run.sh
      - homer-data-semaphore:/homer-semaphore/
      - homer-data-mysql:/var/lib/mysql
    entrypoint:
      - /run.sh
    env_file:
      - ./homer.env
    restart: always
volumes:
  homer-data-semaphore:
  homer-data-mysql:
  homer-data-dashboard:
